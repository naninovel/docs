<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Спасибо за покупку</title>
    <link rel="icon" href="../assets/img/nani-logo.svg" sizes="any" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="frame">

    <img class="nani-head" src="../assets/img/nani-logo.svg" alt="" width="176" height="172">
    <img class="nani-paws inner" src="../assets/img/nani-paws-inner.svg" alt="" width="176" height="35">
    <img class="nani-paws outer" src="../assets/img/nani-paws-outer.svg" alt="" width="176" height="35">

    <section class="card">
        <h1>Спасибо за покупку!</h1>
        <div class="slot">
            <div class="slot-label">Ваш ключ лицензии</div>
            <div class="slot-row">
                <strong class="key"></strong>
                <button class="copy">Копировать</button>
            </div>
        </div>
        <p>Войдите в <a href="https://account.naninovel.com" target="_blank">учётную запись</a> и зарегистрируйте лицензию, используя ваш ключ. После регистрации Naninovel можно будет скачать в разделе <a href="https://account.naninovel.com/download" target="_blank">Download</a>.</p>
        <p class="note">Если возникнут проблемы с регистрацией или скачиванием, обращайтесь на почту: <a href="mailto:info@naninovel.com">info@naninovel.com</a>.</p>
    </section>

</main>

<script type="module">
    const key = document.querySelector(".key"), copy = document.querySelector(".copy");
    key.textContent = "TK" + new URLSearchParams(location.search).get("PaymentId");
    copy.addEventListener("click", async () => {
        try {
            await navigator.clipboard.writeText(key.textContent);
            copy.textContent = "Скопировано";
            setTimeout(() => copy.textContent = "Копировать", 2000);
        } catch {
            getSelection().selectAllChildren(key);
        }
    });
</script>

</body>
</html>
